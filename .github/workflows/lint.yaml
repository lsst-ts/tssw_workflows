name: lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install
        run: |
          $CONDA/bin/conda config --set solver classic
          $CONDA/bin/conda install -c lsstts -c conda-forge pre-commit ts-pre-commit-config python=3.12 -y
          $CONDA/bin/generate_pre_commit_conf --skip-pre-commit-install

      - name: Run pre commit checks
        run: $CONDA/bin/pre-commit run --all
