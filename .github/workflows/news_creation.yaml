name: ChangelogUpdated

on:
  workflow_call:
    
env:
  PYTHON_VERSION: '3.13'


jobs:
  build:
    name: Check for new news fragments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          auto-activate-base: true

      - name: Install
        run: |
          conda install -c lsstts -c conda-forge pre-commit ts-pre-commit-config -y
          conda install -c conda-forge towncrier=23 -y
          generate_pre_commit_conf --skip-pre-commit-install
  
      - name: Run towncrier check command
        run: |
          towncrier check --compare-with origin/develop --config towncrier.toml

